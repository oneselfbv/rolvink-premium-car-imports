const eur=n=>n==null?'—':'€ '+n.toLocaleString('de-DE');
let map,cluster,ritLayer,welsum;
try{const st=JSON.parse(localStorage.getItem('rolvink_koopjes_status')||'{}');DATA.bikes=DATA.bikes.filter(x=>{const q=(x.link||'').match(/(\d{9,})/);return !(q&&st[q[1]]==='genegeerd');});}catch(_){}
function styleFor(k){
 if(k==='TOP')return{r:9,color:'#155e30',fill:'#1f7a3f',op:1};
 if(k==='GOED')return{r:7,color:'#7c4a1e',fill:'#B87333',op:.95};
 return{r:5,color:'#6b625c',fill:'#9a9088',op:.6};
}
function init(){
 map=L.map('map',{center:[51.3,9.2],zoom:6,scrollWheelZoom:true});
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
 // Welsum basis
 welsum=L.marker(DATA.welsum,{title:'Welsum (basis)',icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:#2A2A2A;border:2px solid #B87333;border-radius:50%;box-shadow:0 0 0 2px #fff"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup('<b>Welsum</b><br>basis / vertrekpunt');
 cluster=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true});
 buildMarkers();
 map.addLayer(cluster);
 ritLayer=L.layerGroup(); buildRitten(); map.addLayer(ritLayer);
 const b=L.latLngBounds(DATA.bikes.map(x=>[x.lat,x.lon])); b.extend(DATA.welsum); map.fitBounds(b.pad(0.12));
 document.getElementById('fTop').onchange=buildMarkers;
 document.getElementById('fRit').onchange=()=>{document.getElementById('fRit').checked?map.addLayer(ritLayer):map.removeLayer(ritLayer);};
}
function buildMarkers(){
 cluster.clearLayers();
 const topOnly=document.getElementById('fTop') && document.getElementById('fTop').checked;
 DATA.bikes.forEach(x=>{
  if(topOnly && !(x.klasse==='TOP'||x.klasse==='GOED'))return;
  const s=styleFor(x.klasse);
  const m=L.circleMarker([x.lat,x.lon],{radius:s.r,color:s.color,weight:1.5,fillColor:s.fill,fillOpacity:s.op});
  const net=x.netto==null?'<span style="color:#8a807b">n.t.b.</span>':'<span class="pp-net" style="color:'+(x.netto>=1500?'#1f7a3f':x.netto>=0?'#9A5A24':'#a3341f')+'">'+eur(x.netto)+'</span>';
  m.bindPopup('<b>'+x.titel+'</b><br><span style="color:#8a807b">'+x.groep+' · '+x.klasse+(x.fav?' · fav '+x.fav:'')+'</span><br>Vraagprijs <b>'+eur(x.prijs)+'</b> · Netto '+net+'<br>'+(x.regio||x.plz)+(x.kleur?' · '+x.kleur:'')+'<br><a class="pp-lnk" href="'+x.link+'" target="_blank" rel="noreferrer">bekijk op Kleinanzeigen ↗</a>');
  cluster.addLayer(m);
 });
}
function buildRitten(){
 ritLayer.clearLayers();
 DATA.ritten.forEach(r=>{
  const w=r.tot>=3000?4:r.tot>=2000?3:2;
  const col=r.tot>=3000?'#1f7a3f':r.tot>=1500?'#B87333':'#9a9088';
  const pl=L.polyline([r.a,r.b],{color:col,weight:w,opacity:.55,dashArray:'4 5'});
  pl.bindPopup('<b>Rit-paar</b><br>'+r.titelA+'<br>+ '+r.titelB+'<br>±'+r.km+' km · samen netto <b>'+eur(r.tot)+'</b>');
  ritLayer.addLayer(pl);
 });
}
function _unlockGate(){document.getElementById('gate').style.display='none';setTimeout(()=>{init();map.invalidateSize();},60);}
document.getElementById('gcode').addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.value.trim().toLowerCase()==='welsum'){try{localStorage.setItem('rvk_ok','1');}catch(_){}_unlockGate();}else e.target.value='';}});
try{if(localStorage.getItem('rvk_ok')==='1')_unlockGate();}catch(_){}
