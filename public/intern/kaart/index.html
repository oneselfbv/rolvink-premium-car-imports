<style>
:root{--page:#f4efe7;--surface:#fff;--ink:#232020;--muted:#8a807b;--ring:#e2d9cc;--copper:#B87333;--coppertxt:#9A5A24;--top:#1f7a3f;--crit:#a3341f}
@media (prefers-color-scheme:dark){:root{--page:#1c1a19;--surface:#262322;--ink:#ece5db;--muted:#8a807b;--ring:#3a3532;--coppertxt:#d59454;--top:#5bbd7e}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--ring);flex-wrap:wrap}
.bar h1{font-family:Cinzel,Georgia,serif;font-weight:600;letter-spacing:.18em;font-size:15px;margin:0;text-transform:uppercase}
.bar .sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--coppertxt)}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.ctrls label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--ink)}
.leg{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;border-radius:50%;margin-right:3px;vertical-align:middle}
a.back{color:var(--coppertxt);text-decoration:none;font-size:12px}
.knav{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}
.knav a{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:4px 9px;border:1px solid var(--ring);border-radius:3px}
.knav a.act{color:var(--coppertxt);border-color:var(--copper);font-weight:600}
.knav a:hover{color:var(--coppertxt);border-color:var(--copper)}
#map{flex:1;min-height:0;position:relative}
.leaflet-popup-content{font-family:inherit;font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-size:13.5px}
.pp-net{font-weight:700}
.pp-lnk{color:var(--coppertxt);text-decoration:none}
#gate{position:fixed;inset:0;background:var(--page);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#gate input{background:var(--surface);color:var(--ink);border:1px solid var(--ring);padding:11px 14px;font:inherit;text-align:center;letter-spacing:.2em}
#gate .glab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--coppertxt)}

#pan{position:absolute;top:auto;right:12px;bottom:12px;width:338px;max-height:min(72vh,620px);z-index:800;background:var(--surface);border:1px solid var(--ring);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;font-size:12.5px}
#pan.hid #panL,#pan.hid .pan-f{display:none}
.pan-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ring);background:color-mix(in srgb,var(--copper) 8%,transparent)}

.pan-h .n{color:var(--muted);font-size:11px;margin-left:auto}
.pan-h button{background:none;border:1px solid var(--ring);color:var(--muted);border-radius:3px;cursor:pointer;font:inherit;line-height:1;padding:2px 7px}
#panL{overflow:auto}
.rt{padding:8px 10px;border-bottom:1px solid var(--ring);cursor:pointer}
.rt:hover{background:color-mix(in srgb,var(--copper) 7%,transparent)}
.rt.on{background:color-mix(in srgb,var(--copper) 15%,transparent);border-left:3px solid var(--copper);padding-left:7px}
.rt .r1{display:flex;align-items:baseline;gap:6px}
.rt .rk{color:var(--muted);font-size:11px;min-width:15px}
.rt .tt{flex:1;font-weight:600;line-height:1.25}
.rt .nt{font-weight:700;color:var(--top);white-space:nowrap}
.rt .r2{color:var(--muted);font-size:11px;margin-top:3px;padding-left:21px;line-height:1.35}
.rt .om{color:var(--coppertxt)}
.rt .rd{display:none;margin:6px 0 2px;padding-left:21px}
.rt.on .rd{display:block}
.rdl{font-size:11.5px;line-height:1.4;padding:4px 0;border-top:1px dotted var(--ring)}
.rdl span{color:var(--muted)}
.pil{display:inline-block;font-size:10.5px;line-height:1.5;padding:1px 6px;border-radius:9px;margin:2px 3px 0 0;border:1px solid var(--ring);color:var(--muted)}
.pil.ok{color:#1f7a3f;border-color:#1f7a3f}
.pil.mid{color:#9A5A24;border-color:#B87333}
.pil.bad{color:#a3341f;border-color:#a3341f}
.pil.onb{opacity:.75}
.pan-f{padding:7px 10px;border-top:1px solid var(--ring);color:var(--muted);font-size:11px}
.pan-e{padding:14px 10px;color:var(--muted)}
.ctrls select{background:var(--surface);color:var(--ink);border:1px solid var(--ring);border-radius:3px;font:inherit;font-size:12px;padding:2px 4px}
.ctrls input[type=range]{width:82px;accent-color:var(--copper);vertical-align:middle}
@media(max-width:760px){#pan{right:6px;left:6px;width:auto;bottom:6px;max-height:46vh}}
</style></head><body>

const eur=n=>n==null?'—':'€ '+n.toLocaleString('de-DE');
let map,cluster,ritLayer,selLayer,welsum;
const ALLB=DATA.bikes.slice();
function loadSt(){try{return JSON.parse(localStorage.getItem('rolvink_koopjes_status')||'{}')}catch(e){return{}}}
function bikeId(l){var m=(l||'').match(/(\d{9,})/);return m?m[1]:null}
function activeBikes(){var st=loadSt();return ALLB.filter(function(x){var q=bikeId(x.link);return !(q&&(st[q]==='genegeerd'||st[q]==='verkocht'));});}
DATA.bikes=activeBikes();

/* ---------- rit-rekenmodel (zelfde als routes_pool.py: hemelsbreed x1,28 en EUR 0,25/km) ---------- */
const WPT=DATA.welsum, RKM=0.25, WFAC=1.28, MAXROWS=25;
function hav(a,b){var p=Math.PI/180,x=0.5-Math.cos((b[0]-a[0])*p)/2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*(1-Math.cos((b[1]-a[1])*p))/2;return 2*6371*Math.asin(Math.sqrt(x));}
function wkm(a,b){return hav(a,b)*WFAC;}
const ADJ={tuvLang:150,tuvKort:0,tuvGeen:-350,tuvOnb:-150,hVol:400,hRecent:150,hGeen:-250,hOnb:-100};
const NU=new Date();
function tuvInfo(x){
 var s=String(x.tuv||'').trim();
 if(!s)return{k:'onb',lab:'TÜV ?',adj:ADJ.tuvOnb};
 if(/^nieuw/i.test(s))return{k:'lang',lab:'TÜV nieuw',adj:ADJ.tuvLang};
 if(/verlopen|geen/i.test(s))return{k:'geen',lab:/verlopen/i.test(s)?'TÜV verlopen':'geen TÜV',adj:ADJ.tuvGeen};
 var m=s.match(/(\d{1,2})\/(\d{4})/);
 if(m){var mnd=(+m[2]-NU.getFullYear())*12+((+m[1]-1)-NU.getMonth());
  if(mnd>=12)return{k:'lang',lab:'TÜV '+s,adj:ADJ.tuvLang};
  if(mnd>0)return{k:'kort',lab:'TÜV '+s,adj:ADJ.tuvKort};
  return{k:'geen',lab:'TÜV verlopen',adj:ADJ.tuvGeen};}
 return{k:'onb',lab:'TÜV ?',adj:ADJ.tuvOnb};
}
function histInfo(x){
 var h=String(x.hist||'?');
 if(h==='vol')return{k:'vol',lab:'volle historie',adj:ADJ.hVol};
 if(h==='recent')return{k:'recent',lab:'recent onderhoud',adj:ADJ.hRecent};
 if(h==='geen')return{k:'geen',lab:'geen historie',adj:ADJ.hGeen};
 return{k:'onb',lab:'historie ?',adj:ADJ.hOnb};
}
function netAdj(x){
 if(x.netto==null)return null;
 if(!gv('fPap'))return x.netto;
 return x.netto+tuvInfo(x).adj+histInfo(x).adj;
}
function passPap(x){
 var f=gv('fPap2'),t=tuvInfo(x),h=histInfo(x);
 if(f==='tuv')return t.k==='lang'||t.k==='kort';
 if(f==='tuv12')return t.k==='lang';
 if(f==='hist')return h.k==='vol'||h.k==='recent';
 if(f==='beide')return (t.k==='lang'||t.k==='kort')&&(h.k==='vol'||h.k==='recent');
 return true;
}
function pill(txt,kind){return '<span class="pil '+kind+'">'+txt+'</span>';}
function pillFor(x){
 var t=tuvInfo(x),h=histInfo(x);
 var pt=t.k==='lang'?'ok':t.k==='kort'?'mid':t.k==='geen'?'bad':'onb';
 var ph=h.k==='vol'?'ok':h.k==='recent'?'mid':h.k==='geen'?'bad':'onb';
 return pill(t.lab,pt)+pill(h.lab,ph);
}
function gv(id){var e=document.getElementById(id);return e?(e.type==='checkbox'?e.checked:e.value):null;}
function klasseOk(k){var m=gv('fKlasse');if(m==='TOP')return k==='TOP';if(m==='TOPGOED')return k==='TOP'||k==='GOED';return true;}
function shortT(t){var s=String(t||'').replace(/^BMW\s*/i,'');return s.length>26?s.slice(0,25)+'…':s;}
var ROUTES=[],SELI=-1;

function candidates(){
 var out=[];
 DATA.bikes.forEach(function(x,i){
  if(!klasseOk(x.klasse))return;
  if(!passPap(x))return;
  if(x.lat==null||x.lon==null)return;
  var nv=netAdj(x);
  if(nv==null||nv<=0)return;
  out.push({b:x,i:i,c:[x.lat,x.lon],net:nv,key:bikeId(x.link)||('i'+i)});
 });
 return out;
}
function mkRoute(stops,km){
 var som=0,far=0;
 stops.forEach(function(s){som+=s.net;var d=wkm(WPT,s.c);if(d>far)far=d;});
 var kost=km*RKM;
 return {stops:stops,km:Math.round(km),kosten:Math.round(kost),tot:Math.round(som-kost),
         omweg:Math.round(km-2*far),perkm:(som-kost)/Math.max(km,1)};
}
function computeRoutes(){
 var P=candidates(),n=P.length,maxKm=+gv('fKm'),trio=gv('fMode')==='trio',res=[],i,j,k;
 var dW=[],d=[];
 for(i=0;i<n;i++){dW[i]=wkm(WPT,P[i].c);d[i]=[];}
 for(i=0;i<n;i++)for(j=i+1;j<n;j++){var v=wkm(P[i].c,P[j].c);d[i][j]=v;d[j][i]=v;}
 for(i=0;i<n;i++)for(j=i+1;j<n;j++){
  if(!trio){
   var km2=dW[i]+d[i][j]+dW[j];
   if(km2>maxKm)continue;
   var r2=mkRoute([P[i],P[j]],km2);
   if(r2.tot>0)res.push(r2);
   continue;
  }
  for(k=j+1;k<n;k++){
   var o1=dW[i]+d[i][j]+d[j][k]+dW[k],
       o2=dW[i]+d[i][k]+d[k][j]+dW[j],
       o3=dW[j]+d[j][i]+d[i][k]+dW[k];
   var best=o1,ord=[P[i],P[j],P[k]];
   if(o2<best){best=o2;ord=[P[i],P[k],P[j]];}
   if(o3<best){best=o3;ord=[P[j],P[i],P[k]];}
   if(best>maxKm)continue;
   var r3=mkRoute(ord,best);
   if(r3.tot>0)res.push(r3);
  }
 }
 var srt=gv('fSort');
 res.sort(srt==='om'?function(a,b){return a.omweg-b.omweg||b.tot-a.tot;}
        :srt==='perkm'?function(a,b){return b.perkm-a.perkm;}
        :function(a,b){return b.tot-a.tot;});
 if(gv('fUniq')){
  var used={},uq=[];
  res.forEach(function(r){
   for(var q=0;q<r.stops.length;q++)if(used[r.stops[q].key])return;
   r.stops.forEach(function(s){used[s.key]=1;});
   uq.push(r);
  });
  res=uq;
 }
 return res.slice(0,MAXROWS);
}

 return{r:5,color:'#6b625c',fill:'#9a9088',op:.6};
}
function imgTag(x){return x.img?'<img class="pp-img" loading="eager" src="https://img.kleinanzeigen.de/api/v1/prod-ads/images/'+x.img+'?rule=$_59.JPG" onerror="this.remove()">':''}
var MARKERS={};
function actBtns(x){var id=bikeId(x.link);if(!id)return '';var st=(loadSt()[id]||'');function b(a,lab){return '<button class="pp-b'+(st===a?' pp-on':'')+'" data-id="'+id+'" data-act="'+a+'">'+lab+'</button>'}return '<div class="pp-acts">'+b('bewaard','❤ Bewaar')+b('genegeerd','✕ Negeer')+b('verkocht','✓ Verkocht')+'</div>'}
function setStatus(id,st,btn){
 var o=loadSt();if(o[id]===st){delete o[id];st=''}else{o[id]=st}
 try{localStorage.setItem('rolvink_koopjes_status',JSON.stringify(o));}catch(e){}
 try{fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(function(){});}catch(e){}
 if(btn){var bs=btn.parentNode.querySelectorAll('.pp-b');for(var i=0;i<bs.length;i++)bs[i].classList.remove('pp-on');if(st)btn.classList.add('pp-on');}
 if(st==='genegeerd'||st==='verkocht'){DATA.bikes=activeBikes();map.closePopup();refresh();}
}
if(!window.__ppDeleg){window.__ppDeleg=1;document.addEventListener('click',function(e){var t=e.target;var b=(t&&t.closest)?t.closest('.pp-b'):null;if(b){setStatus(b.getAttribute('data-id'),b.getAttribute('data-act'),b)}});}

function buildMarkers(){
 cluster.clearLayers();MARKERS={};
 DATA.bikes.forEach(function(x){
  if(!klasseOk(x.klasse))return;
  if(!passPap(x))return;
  var s=styleFor(x.klasse);
  var m=L.circleMarker([x.lat,x.lon],{radius:s.r,color:s.color,weight:1.5,fillColor:s.fill,fillOpacity:s.op});
  var nv=netAdj(x);
  var net=nv==null?'<span style="color:#8a807b">n.t.b.</span>':'<span class="pp-net" style="color:'+(nv>=1500?'#1f7a3f':nv>=0?'#9A5A24':'#a3341f')+'">'+eur(nv)+'</span>'+((gv('fPap')&&nv!==x.netto)?'<span style="color:#8a807b"> (basis '+eur(x.netto)+')</span>':'');
  var _bid=bikeId(x.link);if(_bid)MARKERS[_bid]=m;
  m.bindPopup(imgTag(x)+'<b>'+x.titel+'</b><br><span style="color:#8a807b">'+x.groep+' · '+x.klasse+(x.fav?' · fav '+x.fav:'')+'</span><br>Vraagprijs <b>'+eur(x.prijs)+'</b> · Netto '+net+'<br><span style="color:#8a807b">'+(x.regio||'')+(x.km?' · '+x.km.toLocaleString('de-DE')+' km':'')+(x.bj?' · '+x.bj:'')+'</span><br>'+pillFor(x)+(x.hnote?'<div style="color:#8a807b;font-size:11.5px;margin-top:3px">'+x.hnote+'</div>':'')+'<a class="pp-lnk" href="'+x.link+'" target="_blank" rel="noreferrer">bekijk op Kleinanzeigen ↗</a>'+actBtns(x));
  cluster.addLayer(m);
 });
}
function ritKleur(t){return t>=3000?'#1f7a3f':t>=1500?'#B87333':'#9a9088';}
function ritPath(r){var p=[WPT];r.stops.forEach(function(s){p.push(s.c);});p.push(WPT);return p;}
function drawRitten(){
 ritLayer.clearLayers();selLayer.clearLayers();
 var mode=gv('fMode');
 if(mode==='uit')return;
 if(mode==='vast'){
  (DATA.ritten||[]).forEach(function(r){
   var pl=L.polyline([r.a,r.b],{color:ritKleur(r.tot),weight:r.tot>=3000?4:r.tot>=2000?3:2,opacity:.55,dashArray:'4 5'});
   pl.bindPopup('<b>Rit-paar</b><br>'+r.titelA+'<br>+ '+r.titelB+'<br>±'+r.km+' km · samen netto <b>'+eur(r.tot)+'</b>');
   ritLayer.addLayer(pl);
  });
  return;
 }
 ROUTES.forEach(function(r,i){
  var sel=i===SELI, dim=SELI>=0&&!sel;
  var pl=L.polyline(ritPath(r),{color:sel?'#B87333':ritKleur(r.tot),weight:sel?5:1.5,opacity:sel?.95:(dim?.12:.3),dashArray:sel?null:'4 5'});
  pl.on('click',function(){selectRoute(i,false);});
  (sel?selLayer:ritLayer).addLayer(pl);
 });
 if(SELI>=0&&ROUTES[SELI]){
  ROUTES[SELI].stops.forEach(function(s,k){
   var nm=L.marker(s.c,{zIndexOffset:900,title:s.b.titel,icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:#B87333;border:2px solid #fff;color:#fff;font:600 11px/17px Inter,sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:pointer">'+(k+1)+'</div>',iconSize:[20,20],iconAnchor:[10,10]})});
   nm.on('click',function(){var m=MARKERS[s.key];if(m&&cluster.hasLayer(m)){cluster.zoomToShowLayer(m,function(){m.openPopup();});}});
   selLayer.addLayer(nm);
  });
 }
}
function selectRoute(i,zoom){
 SELI=(SELI===i?-1:i);
 drawRitten();paintRows();
 if(SELI>=0&&zoom){var b=L.latLngBounds(ritPath(ROUTES[SELI]));map.fitBounds(b.pad(0.25));}
}
function paintRows(){
 var rows=document.querySelectorAll('#panL .rt');
 for(var i=0;i<rows.length;i++)rows[i].classList.toggle('on',+rows[i].getAttribute('data-i')===SELI);
}
function renderPanel(){
 var L2=document.getElementById('panL'),N=document.getElementById('panN'),F=document.getElementById('panF'),mode=gv('fMode');
 if(mode==='uit'||mode==='vast'){
  N.textContent='';
  L2.innerHTML='<div class="pan-e">'+(mode==='uit'?'Ritten staan uit.':'Vaste paren uit de weekanalyse — kies “beste paren/trio’s” voor live berekening.')+'</div>';
  F.textContent='';return;
 }
 N.textContent=ROUTES.length+' ritten';
 if(!ROUTES.length){L2.innerHTML='<div class="pan-e">Geen combinatie binnen '+gv('fKm')+' km met positief netto. Zet max-km hoger of klasse ruimer.</div>';F.textContent='';return;}
 var h='';
 ROUTES.forEach(function(r,i){
  var tit=r.stops.map(function(s){return shortT(s.b.titel);}).join(' + ');
  var reg=r.stops.map(function(s){return (s.b.regio||'').split('/')[0];}).join(' → ');
  var kl=r.stops.map(function(s){var st=styleFor(s.b.klasse);return '<span class="dot" style="width:9px;height:9px;background:'+st.fill+'"></span>';}).join('');
  var det='<div class="rd">'+r.stops.map(function(s,q){
    return '<div class="rdl"><b>'+(q+1)+'.</b> '+s.b.titel+'<br><span>'+s.b.klasse+' · '+(s.b.regio||'')+' · vraag '+eur(s.b.prijs)+' · netto <b>'+eur(s.net)+'</b></span><br>'+pillFor(s.b)
      +(s.b.link?' <a class="pp-lnk" href="'+s.b.link+'" target="_blank" rel="noreferrer">↗</a>':'')+'</div>';}).join('')+'</div>';
  h+='<div class="rt" data-i="'+i+'"><div class="r1"><span class="rk">'+(i+1)+'</span><span class="tt">'+kl+' '+tit+'</span><span class="nt">'+eur(r.tot)+'</span></div>'
   +'<div class="r2">'+reg+' · '+r.km+' km · rit '+eur(r.kosten)+' · <span class="om">+'+r.omweg+' km omweg</span></div>'+det+'</div>';
 });
 L2.innerHTML=h;
 F.innerHTML='netto = som netto − ritkosten (€0,25/km, heen+terug via alle stops)'+(gv('fPap')?'<br>incl. correctie: TÜV ≥12 mnd +150 / verlopen −350 / onbekend −150 · historie vol +400 / recent +150 / geen −250 / onbekend −100 (schatting)':'');
 paintRows();
}
function refresh(){
 SELI=-1;
 buildMarkers();
 ROUTES=(gv('fMode')==='paar'||gv('fMode')==='trio')?computeRoutes():[];
 drawRitten();renderPanel();
}
function init(){
 map=L.map('map',{center:[51.3,9.2],zoom:6,scrollWheelZoom:true});
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
 welsum=L.marker(DATA.welsum,{title:'Welsum (basis)',icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:#2A2A2A;border:2px solid #B87333;border-radius:50%;box-shadow:0 0 0 3px rgba(184,115,51,.25)"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup('<b>Welsum</b><br>basis / vertrekpunt');
 cluster=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true});
 map.addLayer(cluster);
 ritLayer=L.layerGroup().addTo(map);selLayer=L.layerGroup().addTo(map);
 var pan=document.getElementById('pan');
 L.DomEvent.disableClickPropagation(pan);L.DomEvent.disableScrollPropagation(pan);
 pan.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('a'))return;var t=e.target.closest?e.target.closest('.rt'):null;if(t)selectRoute(+t.getAttribute('data-i'),true);});
 document.getElementById('panT').addEventListener('click',function(){pan.classList.toggle('hid');this.textContent=pan.classList.contains('hid')?'+':'–';});
 ['fKlasse','fMode','fUniq','fSort','fPap','fPap2'].forEach(function(id){document.getElementById(id).addEventListener('change',refresh);});
 var km=document.getElementById('fKm');
 km.addEventListener('input',function(){document.getElementById('fKmL').textContent=km.value+' km';});
 km.addEventListener('change',refresh);
 refresh();
 var b=L.latLngBounds(DATA.bikes.map(function(x){return [x.lat,x.lon];}));b.extend(DATA.welsum);map.fitBounds(b.pad(0.12));
}
function _unlockGate(){document.getElementById('gate').style.display='none';setTimeout(function(){init();map.invalidateSize();},60);}
document.getElementById('gcode').addEventListener('keydown',function(e){if(e.key==='Enter'){if(e.target.value.trim().toLowerCase()==='welsum'){try{localStorage.setItem('rvk_ok','1');}catch(_){}_unlockGate();}else e.target.value='';}});
try{if(localStorage.getItem('rvk_ok')==='1')_unlockGate();}catch(_){}
</script></body></html>
