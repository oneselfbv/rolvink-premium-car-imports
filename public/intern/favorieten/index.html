<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favorieten — Rolvink Premium Imports</title>
<style>
:root{--page:#f4efe7;--surface:#fff;--ink:#232020;--ink2:#4a4442;--muted:#8a807b;--ring:#e2d9cc;--axis:#cbbfae;--copper:#B87333;--coppertxt:#9A5A24;--crit:#a3341f;--top:#1f7a3f}
@media (prefers-color-scheme:dark){:root{--page:#1c1a19;--surface:#262322;--ink:#ece5db;--ink2:#c3b9ad;--muted:#8a807b;--ring:#3a3532;--axis:#4a433e;--coppertxt:#d59454;--top:#5bbd7e}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.4}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
.nav{display:flex;gap:4px;overflow-x:auto;padding:9px 0;border-bottom:1px solid var(--ring);position:sticky;top:0;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(6px);z-index:20}
.nav a{white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-decoration:none;padding:7px 13px;border:1px solid var(--ring);border-radius:3px}
.nav a.act{color:var(--coppertxt);border-color:var(--copper);font-weight:600}
.nav a:hover{color:var(--coppertxt);border-color:var(--copper)}
header{padding:16px 0 6px}
h1{font-family:"Cinzel",Georgia,serif;font-weight:600;letter-spacing:.22em;font-size:22px;margin:0;text-transform:uppercase}
.sub{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--coppertxt)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{border:1px solid var(--ring);border-left:3px solid var(--copper);border-radius:4px;background:var(--surface);padding:9px 11px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.filters select,.filters input{background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:3px;padding:8px 10px;font:inherit;font-size:13px}
.actbtn{background:none;border:1px solid var(--copper);color:var(--coppertxt);border-radius:3px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
.actbtn:hover{background:color-mix(in srgb,var(--copper) 12%,transparent)}
.st{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--ring);border-left:4px solid var(--copper);border-radius:4px;background:var(--surface);padding:11px 12px;position:relative}
.card.d-genegeerd{opacity:.38}.card.d-bewaard{border-left-color:var(--top)}
.card h3{margin:0 60px 3px 0;font-size:14.5px;font-weight:600}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:2px;text-transform:uppercase}
.b-TOP{background:color-mix(in srgb,var(--top) 18%,transparent);color:var(--top)}
.b-GOED{background:color-mix(in srgb,var(--copper) 18%,transparent);color:var(--coppertxt)}
.b-RAND,.b-PROJECT,.b-VERVALT{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.b-MAGER{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.b-nieuw{background:color-mix(in srgb,var(--copper) 85%,#fff);color:#fff;position:absolute;top:10px;right:10px}
.b-fav{background:color-mix(in srgb,#e0a72e 22%,transparent);color:#8a5a00}
.b-res{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.favstar{color:#e0a72e}
.card.d-fav-hi{border-left-color:#e0a72e}
.row{display:flex;flex-wrap:wrap;gap:5px 12px;margin:7px 0;font-size:12.5px;color:var(--ink2)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
.netto{font-weight:700;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dbtn{flex:1;min-width:72px;border:1px solid var(--ring);background:var(--page);color:var(--ink2);border-radius:3px;padding:6px;font:inherit;font-size:11.5px;cursor:pointer}
.dbtn.save:hover{border-color:var(--top);color:var(--top)}.dbtn.dismiss:hover{border-color:var(--crit);color:var(--crit)}.dbtn.bod:hover{border-color:var(--copper);color:var(--coppertxt)}
.dbtn.active-save{background:color-mix(in srgb,var(--top) 15%,transparent);border-color:var(--top);color:var(--top);font-weight:600}
.dbtn.active-dismiss{background:color-mix(in srgb,var(--crit) 12%,transparent);border-color:var(--crit);color:var(--crit);font-weight:600}
a.klink{color:var(--coppertxt);text-decoration:none;font-size:11.5px;display:inline-block;margin-top:6px}
.hint{font-size:11px;color:var(--muted);margin:4px 0 10px}
details.analyse{margin-top:22px;border-top:1px solid var(--ring);padding-top:12px}
details.analyse summary{cursor:pointer;font-family:Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--coppertxt)}
table.an{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
table.an th,table.an td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--ring)}
table.an th:first-child,table.an td:first-child{text-align:left}
table.an th{color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
#gate{position:fixed;inset:0;background:var(--page);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#gate input{background:var(--surface);color:var(--ink);border:1px solid var(--axis);padding:11px 14px;font:inherit;text-align:center;letter-spacing:.2em}
#gate .glab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--coppertxt)}
.dbtn.sold:hover{border-color:var(--coppertxt);color:var(--coppertxt)}.dbtn.active-sold{background:color-mix(in srgb,var(--copper) 15%,transparent);border-color:var(--copper);color:var(--coppertxt);font-weight:600}.card.d-verkocht{opacity:.55}

ap:8px;margin:12px 0 4px;flex-wrap:wrap;align-items:center}.fbar select,.fbar input{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--ring);border-radius:3px;background:var(--surface);color:var(--ink)}.fnote{font-size:11px;color:var(--muted)}.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:5px;padding:10px 12px}.kv{font-size:20px;font-weight:700;color:var(--ink)}.kl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}</style><style>/* fotogrootte-keuze */body[data-sz=s] .imgwrap{aspect-ratio:2/1}body[data-sz=m] .imgwrap{aspect-ratio:3/2}body[data-sz=l] .imgwrap{aspect-ratio:4/3}body[data-sz=xl] .imgwrap{aspect-ratio:1/1}</style></head><body>

function imgHtml(f){return '<div class="imgwrap">'+(f.img?'<img class="cardimg" loading="lazy" src="https://img.kleinanzeigen.de/api/v1/prod-ads/images/'+f.img+'?rule=$_59.JPG" onerror="this.remove()">':'')+'</div>'}
function nettoHtml(f){if(f.netto==null)return '<span class="fnote">geen NL-referentie</span>';var cls=f.netto<0?'net neg':(f.src==='schatting'?'net est':'net');var pre=f.src==='schatting'?'~':'';return 'Netto <span class="'+cls+'">'+pre+eur(f.netto)+'</span>'}
function card(f){var b='';if(f.src==='scan')b+=' <span class="fbadge b-scan">scan</span>';else if(f.src==='schatting')b+=' <span class="fbadge b-est">schatting</span>';if(f.deleted)b+=' <span class="fbadge b-del">verwijderd</span>';return '<div class="fcard'+(f.deleted?' del':'')+'">'+imgHtml(f)+'<span class="ftitle">'+esc(f.title)+b+'</span><div class="fgrp">'+(f.groep?esc(f.groep):'onbekend model')+(f.loc?' · '+esc(f.loc):'')+'</div><div class="frow">Vraag <b>'+eur(f.price)+'</b> &nbsp; '+nettoHtml(f)+(f.nl?' &nbsp; <span class="fnote">NL '+eur(f.nl)+'</span>':'')+'</div><a class="flink" href="'+f.link+'" target="_blank" rel="noopener">bekijk op Kleinanzeigen ↗</a></div>'}
function initKpi(){var act=FAV.filter(function(f){return !f.deleted}).length;var net=FAV.filter(function(f){return f.netto!=null}).length;var best=Math.max.apply(null,FAV.filter(function(f){return f.netto!=null}).map(function(f){return f.netto}).concat([0]));$('kpis').innerHTML=[['Favorieten totaal',FAV.length],['Nog beschikbaar',act],['Met netto',net],['Hoogste netto',eur(best)]].map(function(k){return '<div class="kpi"><div class="kv">'+k[1]+'</div><div class="kl">'+k[0]+'</div></div>'}).join('')}
function render(){var mode=$('fMode').value,q=$('fZoek').value.trim().toLowerCase();var list=FAV.filter(function(f){if(mode==='netto'&&f.netto==null)return false;if(mode!=='all'&&f.deleted)return false;if(q&&(f.title||'').toLowerCase().indexOf(q)<0&&(f.groep||'').toLowerCase().indexOf(q)<0)return false;return true});$('grid').innerHTML=list.map(card).join('')||'<p class="fnote">Niets gevonden.</p>';$('cnt').textContent=list.length+' van '+FAV.length}
function unlockGate(){$('gate').style.display='none';initKpi();render()}
$('gcode').addEventListener('keydown',function(e){if(e.key==='Enter'){if($('gcode').value.trim().toLowerCase()==='welsum'){try{localStorage.setItem('rvk_ok','1')}catch(_){}unlockGate()}else{$('gcode').value=''}}});
['fMode','fZoek'].forEach(function(i){$(i).oninput=render});
try{if(localStorage.getItem('rvk_ok')==='1')unlockGate()}catch(_){}
</script><script>(function(){var K='rvk_imgsize',d=document;function set(v){d.body.dataset.sz=v;try{localStorage.setItem(K,v)}catch(e){}}var cur='m';try{cur=localStorage.getItem(K)||'m'}catch(e){}set(cur);var s=d.getElementById('fSize');if(s){s.value=cur;s.addEventListener('change',function(){set(s.value)})}})();</script></body></html>
